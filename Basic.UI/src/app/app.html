<header class="topbar">
  <h1><a routerLink="/">Security Demo</a></h1>
  @if (auth.username()) {
    <button type="button" class="menu-toggle" aria-label="Menu" aria-haspopup="dialog" (click)="openMenu()">☰</button>
    <!-- Desktop-only nav — hidden below 1200px (see .nav-group media query in
         styles.css). Kept as its own markup, not shared with the drawer below,
         so the two can diverge (e.g. drawer gets extra links desktop doesn't). -->
    <div class="nav-group">
      <nav class="nav" aria-label="Primary">
        <a routerLink="/tasks" routerLinkActive="active" ariaCurrentWhenActive="page">
          My tasks
        </a>
      </nav>
      <div class="user">
        <span class="userBadge">
          <svg class="userIcon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="5" r="2.75"/>
            <path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
          </svg>
          {{ auth.username() }}
        </span>
        <button type="button" class="secondary" (click)="logout()">
          <svg class="btnIcon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/>
            <path d="M10.5 8h-7"/>
            <path d="M8.5 5.5 11 8l-2.5 2.5"/>
          </svg>
          Log out
        </button>
      </div>
    </div>
  } @else {
    <button type="button" (click)="openLogin()">
      <svg class="btnIcon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.5 2.5h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-3"/>
        <path d="M9.5 8h-7"/>
        <path d="M4.5 5.5 2 8l2.5 2.5"/>
      </svg>
      Log in
    </button>
  }
</header>

<main class="container">
  <router-outlet />
</main>

<!-- Native <dialog>: focus trap, Esc and backdrop for free — same pattern as the
     login drawer below, reused rather than a bespoke dropdown panel. Removed from
     the DOM on logout, which also closes it if it happened to be open. -->
@if (auth.username()) {
  <dialog
    #menuDrawer
    class="drawer"
    aria-label="Menu"
    (click)="$event.target === menuDrawer && menuDrawer.close()"
  >
    <div class="drawer-body">
      <button type="button" class="link drawer-close" (click)="menuDrawer.close()">Close</button>
      <div class="user">
        <span class="userBadge">
          <svg class="userIcon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="5" r="2.75"/>
            <path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
          </svg>
          {{ auth.username() }}
        </span>
        <button type="button" class="secondary" (click)="logout()">
          <svg class="btnIcon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/>
            <path d="M10.5 8h-7"/>
            <path d="M8.5 5.5 11 8l-2.5 2.5"/>
          </svg>
          Log out
        </button>
      </div>
      <nav class="nav" aria-label="Primary">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeMenu()">
          Home
        </a>
        <a routerLink="/tasks" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          My tasks
        </a>
      </nav>
    </div>
  </dialog>
} @else {
  <!-- Native <dialog>: focus trap, Esc and backdrop for free. Removed from the DOM
       once a session exists, which also closes it right after a successful login. -->
  <dialog
    #loginDrawer
    class="drawer"
    aria-label="Log in"
    (click)="$event.target === loginDrawer && loginDrawer.close()"
  >
    <div class="drawer-body">
      <button type="button" class="link drawer-close" (click)="loginDrawer.close()">Close</button>
      <app-login />
    </div>
  </dialog>
}
