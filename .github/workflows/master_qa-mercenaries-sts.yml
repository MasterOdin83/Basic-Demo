# Deploy de BasicSTS.API al STS compartido de QA (qa-mercenaries-sts, westus3): el STS que usan
# todas las UIs (cada UI con su API + este STS). Copia de master_qa-demo-sts.yml con otro app-name.
# Secrets: los 3 que genera el Deployment Center del App Service (identidad federada OIDC); si Azure
# generó su propio workflow con nombres con hash, copia esos nombres aquí o borra este archivo.
# App Settings del STS: Captcha__Secret (Turnstile real; appsettings.QA.json trae la clave de prueba),
# Jwt__Key compartida con cada API que valide sus tokens, Cors__UiOrigin con las UIs separadas por ';'.

name: Build and deploy ASP.Net Core app to Azure Web App - qa-mercenaries-sts

on:
  push:
    branches:
      - master
    paths:
      - 'BasicSTS.API/**'
      - 'Basic.Core/**'
      - 'Basic.Data/**'
      - '.github/workflows/master_qa-mercenaries-sts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build BasicSTS.API/BasicSTS.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish BasicSTS.API/BasicSTS.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_QA_MERCENARIES_STS }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_QA_MERCENARIES_STS }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_QA_MERCENARIES_STS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qa-mercenaries-sts'
          slot-name: 'Production'
          package: .
